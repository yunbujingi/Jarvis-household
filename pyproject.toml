[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "jarvis-home"
version = "0.2.1"
description = "Private household ledger and tools for the existing Xiaozhi and HA setup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography==46.0.7", "fastapi==0.162.7", "uvicorn==0.54.0", "mcp==1.30.0", "websockets==14.2"]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "build==1.6.1", "httpx==0.28.1"]
[project.scripts]
jarvis-home = "jarvis_home.web:main"
jarvis-home-mcp = "jarvis_home.mcp:main"
jarvis-home-bridge = "jarvis_home.bridge:main"
jarvis-home-configure = "jarvis_home.bridge:configure"
[tool.setuptools.package-data]
jarvis_home = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
