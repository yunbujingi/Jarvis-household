name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -e '.[dev]'
      - run: mkdir -p evidence
      - run: python -m pip check
      - run: python scripts/dependencies.py --output evidence/dependencies.json
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q --junitxml=evidence/tests.xml
      - run: python -m compileall -q src scripts
      - run: python -m build
      - run: python scripts/verify_dist.py dist > evidence/installed-tests.log 2>&1
      - run: python scripts/release_manifest.py dist
      - run: python scripts/benchmark.py --samples 100 > evidence/benchmark.json
      - run: python scripts/check_repository.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: python-${{ matrix.python }}-${{ github.sha }}
          path: |
            dist/*
            evidence/*
          retention-days: 14
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -e '.[dev]'
      - run: python scripts/dependencies.py
      - run: pip-audit --disable-pip --no-deps -r requirements.lock --format json --output audit.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: audit.json
          retention-days: 14
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sh scripts/test_container.sh
