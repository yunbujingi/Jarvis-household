name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - run: python -m build
      - run: python scripts/check_repository.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose -f deploy/community/compose.yaml config --quiet
      - run: docker compose -f deploy/community/compose.yaml build
      - name: Verify image without credentials or network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,mode=1777 jws-household:0.2.1-source python -c 'import os,tempfile; from pathlib import Path; from jarvis_home.store import Store; from jarvis_home.models import Change; from jarvis_home.inventory import query_items; assert os.getuid()==10001; temp=tempfile.TemporaryDirectory(); s=Store(Path(temp.name)/"ledger"); s.execute("ci-add-item",[Change(action="add_item",name="test",quantity=2,unit="box",location="drawer")]); assert query_items(s.snapshot()["items"],location="drawer")["item_count"]==1; s.execute("ci-undo-item",undo=True); assert not s.snapshot()["items"]; print("container isolated smoke passed")'
